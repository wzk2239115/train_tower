name: smoke_super_omni
description: "30min smoke — image+audio super-omni, tiny 8L, 300 steps"

size_preset: tiny_smoke
train_config: configs/train/continuous.yaml

overrides:
  max_steps: 300
  max_pixels: 262144
  min_pixels: 12544
  max_seq_length: 2048
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  output_dir: outputs/smoke/super_omni
  save_steps: 100
  logging_steps: 5
  use_flow_tower: true

  audio_patch_dim: 80
  audio_n_mels: 80
  audio_patch_t: 4
  audio_sample_rate: 24000
  audio_hop_size: 256
  audio_context_token_id: -1

  video_patch_dim: 1024
  video_num_frames: 16
  video_context_token_id: -1

  cfg_audio_drop_prob: 0.0
  audio_cfg_scale: 1.0
  max_audio_duration_ms: 5000
  max_video_frames_gen: 16

  tower_decoder_prob: 0.2
  cfg_label_drop_prob: 0.1
  tower_self_cond_prob: 0.0
  loss_weights:
    ce: 1.0
    fm: 0.3

curriculum:
  - stage: world_pt
    until_step: 59
    datasets: blip3o_short_pt
    loss_weights: { ce: 0.0, fm: 0.0 }

  - stage: understanding_warmup
    until_step: 119
    datasets: blip3o_short_pt,llava150k_mt
    loss_weights: { ce: 1.0, fm: 0.0 }

  - stage: generation_pt
    until_step: 179
    datasets: blip3o_short_pt,blip3o_long_pt
    task_override: t2i
    loss_weights: { ce: 0.0, fm: 0.0 }
    tower_self_cond_prob: 0.3
    tower_decoder_prob: 0.5

  - stage: unified_mt
    until_step: 239
    datasets: blip3o_short_pt,llava150k_mt,textcaps_mt,wavcaps_pt
    loss_weights: { ce: 1.0, fm: 0.3 }
    tower_decoder_prob: 0.3
    cfg_label_drop_prob: 0.1

  - stage: unified_sft
    until_step: 299
    datasets: llava150k_mt,refcoco_mt,textcaps_mt,wavcaps_pt
    loss_weights: { ce: 1.0, fm: 0.1 }

viz:
  metrics: [loss, fm_loss, ce_loss, grad_norm]
  output_dir: exports/viz/smoke_super_omni
