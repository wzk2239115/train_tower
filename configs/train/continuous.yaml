stage: world_pt
init_mode: scratch
weight_init: random
model_config_path: configs/model/sensenova_500m_mot
tokenizer_name_or_path: configs/tokenizer/qwen3
use_flow_tower: true
datasets: "blip3o_long_pt,blip3o_short_pt"
loss_weights:
  ce: 0.0
  fm: 0.0
tower_decoder_prob: 0.0
cfg_label_drop_prob: 0.15
tower_self_cond_prob: 0.0
tower_self_cond_cfg_min: 1.0
tower_self_cond_cfg_max: 1.0

# One-run super omni curriculum: all 5 stages in a single job (no checkpoint_chain).
# Step totals: 50k + 200k + 100k + 50k + 20k = 420k
curriculum:
  - stage: world_pt
    until_step: 49999
    datasets: "blip3o_long_pt,blip3o_short_pt"
    loss_weights:
      ce: 0.0
      fm: 0.0
    tower_self_cond_prob: 0.0
  - stage: understanding_warmup
    until_step: 249999
    datasets: "blip3o_long_pt,blip3o_short_pt"
    loss_weights:
      ce: 1.0
      fm: 0.0
  - stage: generation_pt
    until_step: 349999
    datasets: "blip3o_long_pt,blip3o_short_pt"
    task_override: t2i
    loss_weights:
      ce: 0.0
      fm: 0.0
    learning_rate: 1.0e-4
    tower_decoder_prob: 0.0
    cfg_label_drop_prob: 0.15
    tower_self_cond_prob: 0.5
    tower_self_cond_cfg_min: 1.0
    tower_self_cond_cfg_max: 3.0
  - stage: unified_mt
    until_step: 399999
    datasets: "blip3o_long_mt,blip3o_short_mt,llava150k_mt,sharegpt4v_mt,refcoco_mt,textcaps_mt"
    max_seq_length: 16384
    loss_weights:
      ce: 1.0
      fm: 0.3
    learning_rate: 1.0e-4
    tower_decoder_prob: 0.2
    cfg_label_drop_prob: 0.15
    tower_self_cond_prob: 0.3
    tower_self_cond_cfg_min: 1.0
    tower_self_cond_cfg_max: 2.0
  - stage: unified_sft
    until_step: 419999
    datasets: "llava150k_sft,sharegpt4v_sft,refcoco_sft,textcaps_sft,docvqa_sft,chartqa_sft"
    max_seq_length: 16384
    gradient_accumulation_steps: 2
    loss_weights:
      ce: 1.0
      fm: 0.1
    learning_rate: 1.2e-4
    tower_decoder_prob: 0.3
    cfg_label_drop_prob: 0.10
    tower_self_cond_prob: 0.2
    tower_self_cond_cfg_min: 1.0
    tower_self_cond_cfg_max: 1.5

max_steps: 420000
output_dir: outputs/pretrain/continuous
deepspeed: configs/deepspeed/zero2.json
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
warmup_steps: 500
max_seq_length: 8192
max_pixels: 4194304
min_pixels: 65536
gradient_checkpointing: true
bf16: true
logging_steps: 10
save_steps: 5000
save_total_limit: 2
dataloader_num_workers: 2
