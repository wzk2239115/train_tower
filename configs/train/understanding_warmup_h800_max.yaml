# understanding_warmup — "max" throughput on 8×80GB (auto-tuned at runtime).
# YAML values are *targets*; tower.train.vram_tune clamps peak VRAM to stable (batch 8, 4M px)
# and raises gradient_accumulation to hit TOWER_TARGET_GLOBAL_BATCH (default 160).
# Do not raise per_device batch + max_pixels together — eager attn peak scales ~ batch × pixels^0.85.
stage: understanding_warmup
init_mode: checkpoint
weight_init: random
model_name_or_path: outputs/pretrain/world_pt_h800
tokenizer_name_or_path: outputs/pretrain/world_pt_h800
datasets: "blip3o_long_pt,blip3o_short_pt"
loss_weights:
  ce: 1.0
  fm: 0.0
max_steps: 200000
output_dir: outputs/pretrain/uw_h800
deepspeed: configs/deepspeed/zero2.json
per_device_train_batch_size: 12
gradient_accumulation_steps: 2
learning_rate: 2.0e-4
warmup_steps: 500
max_seq_length: 8192
max_pixels: 8388608
min_pixels: 65536
gradient_checkpointing: true
bf16: true
logging_steps: 10
save_steps: 5000
save_total_limit: 2
dataloader_num_workers: 12
