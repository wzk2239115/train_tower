# understanding_warmup — H800 80GB-safe "max" (NOT batch 20 / no-ckpt; that OOMs on eager attn).
# Block-causal training always uses eager attention → activation memory dominates.
# Global batch 160 = 8×10×2 (same effective batch as the old 8×20×1 recipe).
# If still OOM: per_device_train_batch_size 8, or max_pixels 4194304 (stable).
stage: understanding_warmup
init_mode: checkpoint
weight_init: random
model_name_or_path: outputs/pretrain/world_pt_h800
tokenizer_name_or_path: outputs/pretrain/world_pt_h800
datasets: "blip3o_long_pt,blip3o_short_pt"
loss_weights:
  ce: 1.0
  fm: 0.0
max_steps: 200000
output_dir: outputs/pretrain/uw_h800
deepspeed: configs/deepspeed/zero2.json
per_device_train_batch_size: 10
gradient_accumulation_steps: 2
learning_rate: 2.0e-4
warmup_steps: 500
max_seq_length: 8192
max_pixels: 6291456
min_pixels: 65536
gradient_checkpointing: true
bf16: true
logging_steps: 10
save_steps: 5000
save_total_limit: 2
dataloader_num_workers: 12
