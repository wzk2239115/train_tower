# Minimal dims for fast CI / local smoke tests.
name: "tiny_smoke"
description: "8L @ 256d — quick forward/freeze checks"
model_config_path: configs/model/sensenova_500m_mot

llm:
  num_hidden_layers: 8
  hidden_size: 256
  intermediate_size: 704
  num_attention_heads: 4
  num_key_value_heads: 2
  head_dim: 64
  max_window_layers: 8

vision:
  hidden_size: 256
  llm_hidden_size: 256

fm_head_dim: 256

tower:
  exit_depth_frac:
    world_elf: 0.28
    audio_elf: 0.44
    semantic_elf: 0.60
    understanding_elf: 0.84
  stage_shallow_world_pt_frac: 0.308
