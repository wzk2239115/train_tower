pool_id: text
task_types: [instruction_following, dialogue, knowledge, reasoning, code]
modality: [text]
description: "文本底座 — 保语言能力、指令跟随、长上下文"

datasets:
  - name: OpenHermes
    key: text__openhermes
    source: "$DATA_ROOT/openhermes"
    annotation_file: train.jsonl
    size: 1_000_000
    format: instruction_following
    quality_tier: gold
    sampling_rate: 1.0
    languages: [en, zh]

  - name: ShareGPT
    key: text__sharegpt
    source: "$DATA_ROOT/sharegpt"
    annotation_file: train.jsonl
    size: 90_000
    format: dialogue
    quality_tier: gold
    sampling_rate: 1.0
    languages: [en, zh]

  - name: UltraChat
    key: text__ultrachat
    source: "$DATA_ROOT/ultrachat"
    annotation_file: train.jsonl
    size: 1_400_000
    format: dialogue
    quality_tier: gold
    sampling_rate: 0.5
    languages: [en]

  - name: WildChat
    key: text__wildchat
    source: "$DATA_ROOT/wildchat"
    annotation_file: train.jsonl
    size: 100_000
    format: dialogue
    quality_tier: silver
    sampling_rate: 1.0
    languages: [en, zh]

  - name: Magpie
    key: text__magpie
    source: "$DATA_ROOT/magpie"
    annotation_file: train.jsonl
    size: 200_000
    format: instruction_following
    quality_tier: gold
    sampling_rate: 1.0
    languages: [en, zh]

  - name: InfinityInstruct
    key: text__infinity_instruct
    source: "$DATA_ROOT/infinity_instruct"
    annotation_file: train.jsonl
    size: 1_000_000
    format: instruction_following
    quality_tier: silver
    sampling_rate: 0.3
    languages: [en, zh]

  - name: BELLE
    key: text__belle
    source: "$DATA_ROOT/belle"
    annotation_file: train.jsonl
    size: 2_000_000
    format: instruction_following
    quality_tier: silver
    sampling_rate: 0.2
    languages: [zh]

  - name: Firefly
    key: text__firefly
    source: "$DATA_ROOT/firefly"
    annotation_file: train.jsonl
    size: 1_600_000
    format: instruction_following
    quality_tier: silver
    sampling_rate: 0.2
    languages: [zh]

conversion:
  instruction_following:
    conversations:
      - from: human
        value: "{instruction}"
      - from: gpt
        value: "{response}"

  dialogue:
    conversations: "{multi_turn_conversations}"
