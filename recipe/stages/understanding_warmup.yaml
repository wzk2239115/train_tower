stage: understanding_warmup
description: "Stage 1 — 理解路径预热. 纯 CE loss, 训练 und vision + und LLM"

checkpoint:
  init_mode: scratch
  weight_init: random
  model_config_path: configs/model/sensenova_500m_mot
  tokenizer_name_or_path: configs/tokenizer/qwen3

datasets: "img_und__blip3o_long_pt,img_und__blip3o_short_pt"

use_flow_tower: true

loss_weights:
  ce: 1.0
  fm: 0.0

tower:
  decoder_prob: 0.0
  self_cond_prob: 0.0

hyperparams:
  learning_rate: 2.0e-4
  warmup_steps: 500
  max_steps: 200000
  max_seq_length: 8192
  max_pixels: 4194304
  min_pixels: 65536
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  bf16: true
  logging_steps: 10
  save_steps: 5000
  save_total_limit: 2
  dataloader_num_workers: 2

output_dir: outputs/pretrain/uw
deepspeed: configs/deepspeed/zero2.json

tower_exit_weights:
  world_elf: 0.0
  semantic_elf: 0.0
  audio_elf: 0.0
  video_elf: 0.0
  understanding_elf: 1.0
  generative_elf: 0.0

note: |
  纯 CE loss 训练 understanding path.
  audio/video exits weight=0, 不需要 audio/video 数据.
  训练 und vision model + und LLM + shared embeddings.
